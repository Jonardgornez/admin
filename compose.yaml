services:
  admin:
    build: .
    image: lykantra-admin
    # 127.0.0.1 only: the console opens on pc-server itself and never from the LAN.
    ports:
      - 127.0.0.1:${ADMIN_PORT:-5173}:8080
    # Docker Desktop already provides host.docker.internal; this line makes it work on other Docker engines too.
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      SERVER_HOST: host.docker.internal
      SERVER_PORT: ${SERVER_PORT:-5000}
