# pc-server: the admin console in Docker Desktop; the server keeps running directly on Windows. See DOCKER.md.
services:
  admin:
    build: .
    image: lykantra-admin
    # 127.0.0.1 only: the console opens on pc-server itself and never from the LAN. Never remove "127.0.0.1:".
    ports:
      - 127.0.0.1:${ADMIN_PORT:-5173}:8080
    # Docker Desktop already provides host.docker.internal; this line makes it work on other Docker engines too.
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
    read_only: true
    # The only places nginx writes, owned by its non-root user (uid 101).
    tmpfs:
      - /tmp:uid=101,gid=101
      - /var/cache/nginx:uid=101,gid=101
      - /etc/nginx/conf.d:uid=101,gid=101
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      SERVER_HOST: host.docker.internal
      SERVER_PORT: ${SERVER_PORT:-5000}
